name: Apply Today layout polish

on:
  push:
    branches:
      - feat/daily-sleep-stars
    paths:
      - .github/workflows/apply-today-layout-polish.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/daily-sleep-stars
      - name: Apply Today layout polish
        run: python scripts/apply_today_layout_polish.py
      - name: Remove one-shot helpers
        run: rm scripts/apply_today_layout_polish.py .github/workflows/apply-today-layout-polish.yml
      - name: Commit integrated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish Dashboard and Agenda view switch"
          git push origin HEAD:feat/daily-sleep-stars
