name: Apply day photos

on:
  push:
    branches:
      - unificar-fotos-del-dia

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: unificar-fotos-del-dia
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply common photo integration
        run: node scripts/apply-day-photos.mjs
      - name: Commit common photo integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gym.js src/main.js src/extras.js tests/day-detail-data.test.js tests/calendar-day-indicators.test.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Integrar fotos del día en Habits"
          git push origin HEAD:unificar-fotos-del-dia
