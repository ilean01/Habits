name: Apply food photo integration

on:
  push:
    branches: [alimentacion-fotos-21-30]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alimentacion-fotos-21-30
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/apply-food-photo-integration.mjs
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gym.js src/main.js
          git diff --cached --quiet || git commit -m "feat: integrar fotos de comida y compresion comun"
          git push
