name: Refactor native daily planner

on:
  push:
    branches:
      - native-daily-planner

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: native-daily-planner
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply refactor
        run: node scripts/refactor-native-daily-planner.mjs
      - name: Commit native planner integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Integrar Agenda del día nativamente"
          git push origin HEAD:native-daily-planner
