name: Apply nutrition progress

on:
  push:
    branches: [progreso-alimentacion-16-20]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: progreso-alimentacion-16-20
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/apply-nutrition-progress.mjs
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js
          git diff --cached --quiet || git commit -m "feat: integrar Progreso de alimentacion"
          git push
