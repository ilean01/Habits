name: Apply library layout fix
on:
  push:
    branches: [biblioteca-lectura-arriba-fix]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: biblioteca-lectura-arriba-fix
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Move reading tools above catalog and fix badge overlap
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def once(path, old, new):
              p=Path(path); s=p.read_text(); n=s.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected 1 occurrence, found {n}')
              p.write_text(s.replace(old,new,1))

          once('src/main.js',
            "function unifiedLibraryView(){return `${heading('TUS LIBROS, EN UN SOLO LUGAR','Biblioteca','Catálogo, lecturas, préstamos y tu bibliotecaria.')}<section class=\"habits-library-embed\" data-library-host></section><details class=\"legacy-reading-tools\"><summary>Mis sesiones, citas y registros anteriores</summary>${libraryView()}</details>`;}",
            "function unifiedLibraryView(){return `${heading('TUS LIBROS, EN UN SOLO LUGAR','Biblioteca','Catálogo, lecturas, préstamos y tu bibliotecaria.')}<section class=\"legacy-reading-tools legacy-reading-tools-primary\"><div class=\"legacy-reading-tools-heading\">Mis sesiones, citas y registros anteriores</div>${libraryView()}</section><section class=\"habits-library-embed\" data-library-host></section>`;}")

          p=Path('src/library-integration.css'); s=p.read_text()
          s=s.replace('.legacy-reading-tools{margin-top:18px;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:14px 16px}', '.legacy-reading-tools{margin:0 0 24px;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:16px 18px;overflow:hidden}')
          s += '\n.legacy-reading-tools-primary{position:relative;z-index:1}\n.legacy-reading-tools-heading{margin-bottom:16px;font-size:13px;font-weight:700;color:var(--text);letter-spacing:.01em}\n.legacy-reading-tools-primary .section-title:first-of-type{margin-top:0}\n.habits-library-embed{clear:both}\n@media(max-width:760px){.legacy-reading-tools{margin-bottom:18px;padding:13px}.legacy-reading-tools-heading{font-size:12px;margin-bottom:12px}}\n'
          p.write_text(s)

          p=Path('src/biblioteca.css'); s=p.read_text()
          anchor='.lib-book-card{background:var(--lib-card);border:1px solid var(--lib-line);border-radius:18px;overflow:hidden;box-shadow:var(--lib-shadow);display:flex;flex-direction:column;min-height:100%}'
          if anchor not in s: raise SystemExit('biblioteca.css anchor missing')
          s=s.replace(anchor, anchor+'.lib-book-card>button:first-child{position:relative;display:block;width:100%;overflow:hidden}.lib-badges{z-index:2;pointer-events:none}',1)
          p.write_text(s)

          p=Path('src/biblioteca-habits.css'); s=p.read_text()
          s=s.replace("font-size:calc(13px * var(--habits-font-scale));", "font-size:calc(12px * var(--habits-font-scale));",1)
          s=s.replace("html.embedded-library .lib-integrated-context strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:500 15px/1.35 'Lora',Georgia,serif", "html.embedded-library .lib-integrated-context strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:500 13px/1.35 'Lora',Georgia,serif",1)
          s=s.replace('html.embedded-library .lib-nav button{min-height:36px;padding:7px 10px;font-size:12px;border-radius:8px}', 'html.embedded-library .lib-nav button{min-height:34px;padding:6px 9px;font-size:11px;border-radius:8px}',1)
          s=s.replace('html.embedded-library .lib-page-head h1{font-size:clamp(22px,2.2vw,28px);', 'html.embedded-library .lib-page-head h1{font-size:clamp(20px,2vw,25px);',1)
          s=s.replace('html.embedded-library .lib-button{padding:8px 11px;border-radius:8px;font-size:12px;', 'html.embedded-library .lib-button{padding:7px 10px;border-radius:8px;font-size:11px;',1)
          p.write_text(s)

          p=Path('tests/library-integration.test.js'); s=p.read_text()
          s += "\ntest('Lectura aparece antes del catálogo y las insignias quedan ancladas a cada libro',async()=>{\n const main=await read('src/main.js');\n const integration=await read('src/library-integration.css');\n const catalogCss=await read('src/biblioteca.css');\n const reading=main.indexOf('legacy-reading-tools-primary');\n const catalog=main.indexOf('habits-library-embed');\n assert.ok(reading>=0&&catalog>=0&&reading<catalog);\n assert.match(integration,/legacy-reading-tools-heading/);\n assert.match(catalogCss,/lib-book-card>button:first-child\\{position:relative/);\n});\n"
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit validated changes
        run: |
          rm .github/workflows/apply-library-layout-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js src/library-integration.css src/biblioteca.css src/biblioteca-habits.css tests/library-integration.test.js .github/workflows/apply-library-layout-fix.yml
          git commit -m "Integrar lectura arriba y corregir superposición en Biblioteca"
          git push origin HEAD:biblioteca-lectura-arriba-fix
