name: Aplicar mejoras de calendario
on:
  push:
    branches: [integrar-calendario-v2]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrar-calendario-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Integrar calendario sobre el main actual
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          main=Path('src/main.js')
          text=main.read_text()
          imp="import { wellbeingView, wellbeingAction } from './wellbeing.js';\n"
          holiday="import { holidayOn } from './paraguay-holidays.js';\n"
          if holiday not in text:
              if imp not in text: raise SystemExit('No se encontró el import de wellbeing')
              text=text.replace(imp,imp+holiday,1)

          start=text.find('function calendarView(){')
          end=text.find('\nfunction upcomingForArea',start)
          if start<0 or end<0: raise SystemExit('No se encontró el bloque actual de calendarView')
          new_calendar=dedent(r'''function calendarToolbar(mode){const week=mode==='week',keys=weekKeys(date);const cap=t=>t.charAt(0).toUpperCase()+t.slice(1);const title=week?`${parseDay(keys[0]).getDate()} – ${prettyDate(keys[6],{day:'numeric',month:'short'})}`:cap(parseDay(month+'-01').toLocaleDateString('es-PY',{month:'long'}))+' '+month.slice(0,4);const step=week?['week-step','data-step="-7"','data-step="7"','Semana anterior','Semana siguiente']:['month','data-step="-1"','data-step="1"','Mes anterior','Mes siguiente'];return `<div class="cal-toolbar"><div class="cal-nav">${btn(icon('ChevronLeft'),step[0],`${step[1]} aria-label="${step[3]}"`,'icon-button')}<h2>${esc(title)}</h2>${btn(icon('ChevronRight'),step[0],`${step[2]} aria-label="${step[4]}"`,'icon-button')}</div><div class="cal-actions"><div class="segmented" role="group" aria-label="Vista del calendario">${btn('Mes','calendar-mode','data-mode="month"',week?'':'active')}${btn('Semana','calendar-mode','data-mode="week"',week?'active':'')}</div>${btn('Hoy','calendar-today','','button outline')}</div></div>`;}
          const holidayTag=d=>{const h=holidayOn(d);return h?`<p class="holiday-note">🇵🇾 Feriado: ${esc(h.name)}</p>`:'';};
          function calendarView(){if(window.calendarMode==='week')return `${heading('HACÉ ESPACIO PARA TUS PLANES','Tu calendario','Tus compromisos y tus momentos, en equilibrio.',btn(icon('Plus')+'Nuevo evento','new-event','','button primary'))}<section class="panel calendar-panel">${calendarToolbar('week')}<div class="week-agenda">${weekKeys(date).map(d=>`<section><h3>${prettyDate(d,{weekday:'short',day:'numeric',month:'short'})}${holidayOn(d)?' <small class="holiday-dot">Feriado</small>':''}</h3>${rec('event').filter(e=>occurs(e,d)).map(e=>eventOnDate(e,d)).sort((a,b)=>(a.time||'').localeCompare(b.time||'')).map(e=>eventCard(e,d)).join('')||'<p class="muted">Sin eventos</p>'}</section>`).join('')}</div></section>`;const first=parseDay(month+'-01'),offset=(first.getDay()+6)%7,gridStart=addDays(dayKey(first),-offset),selected=rec('event').filter(e=>occurs(e,date)).sort((a,b)=>(a.time||'').localeCompare(b.time||''));return `${heading('HACÉ ESPACIO PARA TUS PLANES','Tu calendario','Tus compromisos y tus momentos, en equilibrio.',btn(icon('Plus')+'Nuevo evento','new-event','','button primary'))}<div class="calendar-layout"><section class="panel calendar-panel">${calendarToolbar('month')}<div class="calendar-grid">${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d=>`<div class="weekday">${d}</div>`).join('')}${Array.from({length:42},(_,i)=>{const d=addDays(gridStart,i),ev=rec('event').filter(e=>occurs(e,d)),st=dayStats(rec('habit'),rec('log'),d);return `<button class="calendar-cell ${holidayOn(d)?'holiday-cell':''} ${d.slice(0,7)!==month?'outside':''} ${d===date?'selected':''} ${d===dayKey()?'current':''}" data-action="date" data-date="${d}"><span>${parseDay(d).getDate()}</span>${holidayOn(d)?'<small class="holiday-dot">Feriado</small>':''}<div class="calendar-events">${ev.slice(0,2).map(e=>`<small style="--area:${safeColor(area(e.area).color)}">${esc(e.name)}</small>`).join('')}${ev.length>2?`<small>+${ev.length-2} más</small>`:''}</div>${st.done?`<b class="calendar-progress">${st.done} ✓</b>`:''}</button>`;}).join('')}</div></section><aside><section class="panel"><p class="eyebrow">${prettyDate(date,{weekday:'long'})}</p><h2>${prettyDate(date,{day:'numeric',month:'long'})}</h2>${holidayTag(date)}<div class="agenda-list">${selected.map(e=>eventCard(e,date)).join('')||empty('Este día todavía no tiene eventos.')}</div>${btn(icon('Plus')+'Agregar evento','new-event','','button outline wide')}</section><section class="panel day-history"><h3>Hábitos de este día</h3>${rec('habit').filter(h=>scheduled(h,date)).map(h=>{const l=rec('log').find(l=>l.habitId===h.id&&l.date===date);return `<button class="history-row" data-action="habit-action" data-id="${h.id}" data-date="${date}">${icon(l?.status==='done'?'CheckCircle2':h.icon)}<span>${esc(h.name)}</span><small>${l?.status==='done'?'Hecho':l?.status==='skip'?'Pausa':'Pendiente'}</small></button>`;}).join('')||'<p class="muted">No hay hábitos programados.</p>'}</section></aside></div>`;}
          ''')
          text=text[:start]+new_calendar.rstrip()+text[end:]
          main.write_text(text)

          enh=Path('src/enhancements.js')
          text=enh.read_text()
          text=text.replace('.holiday-cell{box-shadow:inset 0 0 0 1px #c9b487}','')
          text=text.replace('decorateHolidays();decorateHolidayToday();','decorateHolidayToday();')
          enh.write_text(text)

          css=Path('src/style.css')
          text=css.read_text()
          if '.cal-toolbar{' not in text:
              text += dedent(r'''

          .cal-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}.cal-nav{display:flex;align-items:center;gap:6px}.cal-nav h2{margin:0;font-size:23px;min-width:190px;text-align:center}.cal-actions{display:flex;align-items:center;gap:8px}
          .segmented{display:inline-flex;background:var(--soft);border-radius:9px;padding:3px}.segmented button{padding:7px 14px;border-radius:7px;font-size:12px;color:var(--muted);min-height:34px}.segmented button.active{background:var(--panel);color:var(--green);font-weight:600;box-shadow:0 1px 3px #0000000f}
          .cal-actions .button{min-height:40px;padding:8px 14px;font-size:12px}
          .holiday-cell>span{color:#9b7b42}.holiday-note{font-size:12px;color:#8a6d3b;background:#faf6ed;border-radius:8px;padding:8px 10px;margin:-4px 0 12px}
          .week-agenda h3 .holiday-dot{display:inline!important;font-size:9px!important;margin-left:6px}
          @media(max-width:650px){.cal-toolbar{flex-direction:column;align-items:stretch;gap:10px;margin-bottom:12px}.cal-nav{justify-content:space-between}.cal-nav h2{font-size:21px;min-width:0;flex:1}.cal-actions{justify-content:space-between}.segmented{flex:1}.segmented button{flex:1}.calendar-cell .holiday-dot{font-size:7px!important}}
          [data-theme=dark] .holiday-note{background:#332f25;color:#ead9b8}[data-theme=dark] .holiday-cell>span{color:#e0bd7d}
          .calendar-cell{display:flex;flex-direction:column;align-items:center}.calendar-cell>span{margin-left:auto;margin-right:auto}.calendar-cell .calendar-events{align-self:stretch;min-width:0}.calendar-cell .calendar-progress,.calendar-cell .holiday-dot{text-align:center}
          .heading-actions .button{white-space:nowrap}
          ''')
          css.write_text(text)

          test=Path('tests/ui.test.js')
          text=test.read_text()
          old="[data-action=calendar-mode]'
          "
          text=text.replace("await click('[data-action=calendar-mode]');assert.equal", "await click('[data-action=calendar-mode][data-mode=week]');assert.equal")
          test.write_text(text)
          PY
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Guardar cambios validados
        run: |
          git rm .github/workflows/apply-calendario.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/enhancements.js src/main.js src/style.css tests/ui.test.js
          git commit -m "Mejorar calendario mensual y semanal"
          git push origin HEAD:integrar-calendario-v2
