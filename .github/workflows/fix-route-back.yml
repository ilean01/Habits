name: Fix route back
on:
  push:
    branches: [day-service-routing-48-50]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: day-service-routing-48-50
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/fix-route-back.mjs
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js src/day-detail-responsive.css
          git diff --cached --quiet || git commit -m "fix: volver al calendario sin romper hash routes"
          git push
