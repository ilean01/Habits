name: Aplicar agenda por área

on:
  push:
    branches:
      - integrar-area-agenda

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Aplicar patch
        run: git apply --check tmp/area-agenda.patch && git apply tmp/area-agenda.patch

      - name: Quitar archivos temporales
        run: rm -f tmp/area-agenda.patch .github/workflows/apply-area-agenda.yml

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Guardar cambios validados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js src/style.css tmp/area-agenda.patch .github/workflows/apply-area-agenda.yml
          git commit -m "Mostrar próximos eventos dentro de cada área"
          git push origin HEAD:integrar-area-agenda
