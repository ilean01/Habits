name: Apply calendar indicators

on:
  push:
    branches:
      - calendar-day-indicators

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: calendar-day-indicators
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply calendar indicators
        run: node scripts/apply-calendar-indicators.mjs
      - name: Commit calendar indicators
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Integrar indicadores en las celdas del calendario"
          git push origin HEAD:calendar-day-indicators
