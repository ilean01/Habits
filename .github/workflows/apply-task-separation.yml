name: Apply task separation
on:
  push:
    branches:
      - separar-tareas-estados
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python scripts/apply-task-separation.py
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit validated changes
        run: |
          git config user.name "Ileana Sanabria"
          git config user.email "74793571+ilean01@users.noreply.github.com"
          git add -A
          git commit -m "Separar pendientes, para después y completadas"
          git push
