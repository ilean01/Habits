name: Apply meal summary

on:
  push:
    branches: [alimentacion-dia-10-15]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alimentacion-dia-10-15
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/apply-meal-summary.mjs
      - name: Commit generated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js
          git diff --cached --quiet || git commit -m "feat: integrar alimentacion en Mi dia y Ficha diaria"
          git push
