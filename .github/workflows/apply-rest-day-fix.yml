name: Apply rest day fix
on:
  push:
    branches: [fix-descanso-tranquilo]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply day mode model
        run: python3 scripts/apply-rest-day-fix.py
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit validated changes
        run: |
          rm .github/workflows/apply-rest-day-fix.yml scripts/apply-rest-day-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/selectors.js src/planning.js src/daily.js src/main.js tests/selectors.test.js tests/domain.test.js tests/day-modes.test.js .github/workflows/apply-rest-day-fix.yml scripts/apply-rest-day-fix.py
          git commit -m "Diferenciar Día tranquilo y Día de descanso"
          git push
