name: Apply areas removal
on:
  push:
    branches:
      - remove/areas-feature
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remove/areas-feature
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply requested removal
        run: |
          python .github/scripts/remove_areas.py || {
            echo '--- remaining search-area references ---'
            grep -n -C 2 'search-area' src/productivity-tools.js || true
            exit 1
          }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Commit validated removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove Areas feature from the UI"
          git push origin HEAD:remove/areas-feature
