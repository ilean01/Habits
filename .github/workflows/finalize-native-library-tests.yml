name: Finalize native library tests
on:
  push:
    branches: [native-library-37-40]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: native-library-37-40
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/finalize-native-library-tests.mjs
      - name: Commit tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/habits.spec.js
          git diff --cached --quiet || git commit -m "test: validar Biblioteca nativa sin iframe"
          git push
