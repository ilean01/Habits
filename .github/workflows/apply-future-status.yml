name: Apply future status patch

on:
  push:
    branches:
      - fix/future-status-programado
    paths:
      - .github/workflows/apply-future-status.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/future-status-programado
      - name: Apply Programado integration
        run: python scripts/apply_future_status.py
      - name: Remove one-shot patch helpers
        run: rm scripts/apply_future_status.py .github/workflows/apply-future-status.yml
      - name: Commit integrated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate Programado future states"
          git push origin HEAD:fix/future-status-programado
