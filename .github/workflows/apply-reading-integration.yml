name: Aplicar mejoras de lectura

on:
  push:
    branches: [integrar-mejoras-lectura]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrar-mejoras-lectura
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Aplicar integración del patch
        run: python3 scripts/apply-reading-integration.py
      - name: Quitar archivos temporales
        run: rm scripts/apply-reading-integration.py .github/workflows/apply-reading-integration.yml
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Guardar integración validada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrar rincón de lectura con Biblioteca" 
          git push origin HEAD:integrar-mejoras-lectura
