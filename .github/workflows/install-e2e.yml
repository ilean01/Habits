name: Install browser tests
on:
  push:
    branches: [consolidacion-hci-ingenieria]
permissions:
  contents: write
jobs:
  install-e2e:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consolidacion-hci-ingenieria
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --save-dev @playwright/test
      - run: npm pkg set scripts.test:e2e="playwright test"
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Commit Playwright dependency
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Agregar pruebas E2E con Playwright"
          git pull --rebase origin consolidacion-hci-ingenieria
          git push origin HEAD:consolidacion-hci-ingenieria
