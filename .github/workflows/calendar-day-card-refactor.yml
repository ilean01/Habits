name: Refactor calendar day card

on:
  push:
    branches:
      - calendar-day-card

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: calendar-day-card
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply refactor
        run: node scripts/refactor-calendar-day-card.mjs
      - name: Commit day card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Crear ficha limpia del día en Calendario"
          git push origin HEAD:calendar-day-card
