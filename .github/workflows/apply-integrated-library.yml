name: Apply integrated library refactor
on:
  push:
    branches: [integrar-biblioteca-habits-y-ci]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrar-biblioteca-habits-y-ci
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/apply-integrated-library.mjs
      - name: Commit generated integration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/biblioteca-main.js src/biblioteca/views.js
          git commit -m "Integrar Biblioteca visualmente dentro de Habits"
          git push origin HEAD:integrar-biblioteca-habits-y-ci
