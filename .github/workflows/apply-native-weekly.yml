name: Apply native weekly frequency
on:
  push:
    branches:
      - frecuencia-semanal-nativa
    paths:
      - .github/workflows/apply-native-weekly.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: frecuencia-semanal-nativa
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply native weekly frequency
        run: python3 .github/scripts/apply-native-weekly.py
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit validated changes
        run: |
          rm .github/workflows/apply-native-weekly.yml
          rm .github/scripts/apply-native-weekly.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js src/enhancements.js src/style.css tests/native-weekly-frequency.test.js .github/workflows/apply-native-weekly.yml .github/scripts/apply-native-weekly.py
          git commit -m "Integrar frecuencia semanal en el editor de hábitos"
          git push origin HEAD:frecuencia-semanal-nativa
