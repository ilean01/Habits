name: Apply event service
on:
  push:
    branches: [centralizar-choques-eventos]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Centralize event validation
        run: python3 scripts/apply-event-service.py
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit validated changes
        run: |
          rm .github/workflows/apply-event-service.yml
          rm scripts/apply-event-service.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js src/planning.js src/event-service.js tests/event-service.test.js .github/workflows/apply-event-service.yml scripts/apply-event-service.py
          git commit -m "Centralizar validación de eventos y horarios"
          git push
