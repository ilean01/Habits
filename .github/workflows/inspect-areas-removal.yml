name: Inspect areas removal
on:
  push:
    branches: [remove/areas-feature]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find all area feature references
        run: |
          echo '=== AREA UI REFERENCES ==='
          grep -RniE "Mis áreas|new-area|edit-area|areasView\(|view==='areas'|data-view=\"areas\"|MOBILE_MORE_IDS.*areas|a==='area'|area-save|area-delete" src tests || true
          echo '=== AREA RECORD REFERENCES ==='
          grep -RniE "rec\('area'\)|records\('area'\)|kind.?===.?['\"]area['\"]|data-area" src tests || true
