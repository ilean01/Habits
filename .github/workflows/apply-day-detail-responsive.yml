name: Apply day detail responsive

on:
  push:
    branches:
      - responsive-day-detail

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: responsive-day-detail
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply responsive integration
        run: node scripts/apply-day-detail-responsive.mjs
      - name: Commit responsive integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Integrar ficha responsive en Calendario"
          git push origin HEAD:responsive-day-detail
