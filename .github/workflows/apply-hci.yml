name: Aplicar consolidación HCI
on:
  push:
    branches: [consolidacion-hci-software]
    paths:
      - scripts/apply_hci_consolidation.py
      - .github/workflows/apply-hci.yml
      - tests/**
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consolidacion-hci-software
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Aplicar transformaciones
        run: python scripts/apply_hci_consolidation.py
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Guardar consolidación generada
        run: |
          if git diff --quiet; then
            echo "Sin cambios generados"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js src/enhancements.js
          git commit -m "Integrar navegación y coherencia HCI en el render principal"
          git push origin HEAD:consolidacion-hci-software
