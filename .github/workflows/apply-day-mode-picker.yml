name: Apply day type picker

on:
  push:
    branches:
      - feat/daily-sleep-stars
    paths:
      - .github/workflows/apply-day-mode-picker.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/daily-sleep-stars
      - name: Apply day type picker
        run: python scripts/apply_day_mode_picker.py
      - name: Remove one-shot helpers
        run: rm scripts/apply_day_mode_picker.py .github/workflows/apply-day-mode-picker.yml
      - name: Commit integrated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace day type dropdown with clear inline choices"
          git push origin HEAD:feat/daily-sleep-stars
