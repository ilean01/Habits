name: Apply final UI and code cleanup

on:
  push:
    branches:
      - cleanup/final-ui-code-cleanup
    paths:
      - .github/workflows/apply-final-cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/final-ui-code-cleanup
      - name: Apply final cleanup
        run: python scripts/apply_final_cleanup.py
      - name: Remove one-shot helpers
        run: rm scripts/apply_final_cleanup.py .github/workflows/apply-final-cleanup.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply final UI and code cleanup"
          git push origin HEAD:cleanup/final-ui-code-cleanup
