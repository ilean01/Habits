name: Apply 41-47
on:
  push:
    branches: [stabilize-41-47]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilize-41-47
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/apply-41-47.mjs
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js src/daily-planner.js src/daily-planner.css src/library-native-host.js src/library-native.css src/biblioteca-main.js index.html tests/daily-planner-mood.test.js
          git diff --cached --quiet || git commit -m "feat: completar estabilizacion 41-47"
          git push
