name: Apply photo offline integration
on:
  push:
    branches: [photo-offline-gallery-backup]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: photo-offline-gallery-backup
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/apply-photo-offline-integration.mjs
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/store.js src/nutrition.js src/gym.js src/extras.js src/main.js
          git diff --cached --quiet || git commit -m "feat: integrar fotos offline, galeria y backup completo"
          git push
