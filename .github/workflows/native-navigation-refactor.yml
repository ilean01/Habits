name: Refactor native tasks navigation

on:
  push:
    branches:
      - native-tasks-navigation

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: native-tasks-navigation
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply refactor
        run: node scripts/refactor-native-navigation.mjs
      - name: Commit native navigation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Hacer nativa la navegación de Tareas"
          git push origin HEAD:native-tasks-navigation
