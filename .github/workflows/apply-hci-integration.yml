name: Apply HCI integration

on:
  push:
    branches:
      - hci-coherencia-2026-09-23
    paths:
      - '.patches/apply_hci_manual.py'
      - '.github/workflows/apply-hci-integration.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hci-coherencia-2026-09-23
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify Biblioteca integration already present
        run: |
          test -f supabase/migrations/20260923100000_biblioteca_para_todos.sql
          test -f supabase/migrations/20260923101000_biblioteca_gestores.sql
          test -f tests/library-sharing.test.js
          test -f tests/library-manager.test.js
          grep -q "biblioteca_disponibles" src/biblioteca-main.js
          grep -q "biblioteca_can_manage" src/biblioteca-main.js
      - name: Apply HCI coherence transformations
        run: python .patches/apply_hci_manual.py
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit validated integration
        run: |
          rm -rf .patches
          rm -f .github/workflows/apply-hci-integration.yml
          git config user.name "ChatGPT for Ileana"
          git config user.email "74793571+ilean01@users.noreply.github.com"
          git add -A
          git commit -m "Integrar coherencia HCI sobre Biblioteca por cuenta"
          git push origin HEAD:hci-coherencia-2026-09-23
