name: Apply HCI integration

on:
  push:
    branches:
      - hci-coherencia-2026-09-23
    paths:
      - '.patches/**'
      - '.github/workflows/apply-hci-integration.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hci-coherencia-2026-09-23
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply Biblioteca patch
        run: |
          git apply --check .patches/biblioteca-para-todos.patch
          git apply .patches/biblioteca-para-todos.patch
      - name: Apply HCI coherence patch
        run: |
          git apply --check .patches/hci-coherencia.patch
          git apply .patches/hci-coherencia.patch
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs src supabase tests
          git commit -m "Integrar coherencia HCI y Biblioteca por cuenta"
          git push origin HEAD:hci-coherencia-2026-09-23
