name: Apply HCI integration

on:
  push:
    branches:
      - hci-coherencia-2026-09-23
    paths:
      - '.patches/**'
      - '.github/workflows/apply-hci-integration.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: hci-coherencia-2026-09-23
          fetch-depth: 0

      - name: Apply Biblioteca and HCI changes
        shell: bash
        run: |
          set -euo pipefail
          cat .patches/biblioteca-*.part > /tmp/biblioteca.patch
          cat .patches/hci-*.part > /tmp/hci.patch
          git apply --check --exclude=src/biblioteca-main.js --exclude=src/biblioteca/views.js /tmp/biblioteca.patch
          git apply --exclude=src/biblioteca-main.js --exclude=src/biblioteca/views.js /tmp/biblioteca.patch
          python .patches/apply_manual.py
          grep -q "biblioteca_disponibles" src/biblioteca-main.js
          grep -q "data-lib-switch" src/biblioteca/views.js
          grep -q "export function shareView" src/biblioteca/views.js
          test -f supabase/migrations/20260923100000_biblioteca_para_todos.sql
          test -f tests/library-sharing.test.js
          git apply --check /tmp/hci.patch
          git apply /tmp/hci.patch

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build PWA
        run: npm run build

      - name: Commit validated integration
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .patches
          rm -f .github/workflows/apply-hci-integration.yml
          git config user.name "ChatGPT for Ileana"
          git config user.email "74793571+ilean01@users.noreply.github.com"
          git add -A
          git commit -m "Unificar Biblioteca y corregir coherencia HCI"
          git push origin HEAD:hci-coherencia-2026-09-23
