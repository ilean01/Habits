name: Finalize library HCI
on:
  push:
    branches: [consolidacion-hci-ingenieria]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consolidacion-hci-ingenieria
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python scripts/finalize-library-hci.py
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js src/biblioteca-main.js biblioteca.html docs/REQUISITOS.md
          git diff --cached --quiet && exit 0
          git commit -m "Cerrar coherencia entre Habits y Biblioteca"
          git pull --rebase origin consolidacion-hci-ingenieria
          git push origin HEAD:consolidacion-hci-ingenieria
