name: Validate Habits
on:
  push:
    branches: [main, consolidacion-hci-ingenieria]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
