name: Finalizar consolidación HCI
on:
  push:
    branches: [consolidacion-hci-software]
    paths:
      - scripts/finalize_hci.py
      - .github/workflows/finalize-hci.yml
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consolidacion-hci-software
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python scripts/finalize_hci.py
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Guardar finalización
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js
          git commit -m "Completar reordenado táctil y progreso contextual"
          git push origin HEAD:consolidacion-hci-software
