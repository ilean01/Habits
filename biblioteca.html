<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#6f7f64">
  <meta name="description" content="Biblioteca integrada a Habits, personal y compartible con permisos.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>Biblioteca · Habits</title>
  <script>if(new URLSearchParams(location.search).get('embedded')==='1')document.documentElement.classList.add('embedded-library')</script>
  <style>
    html.embedded-library body{min-height:0}
    html.embedded-library .lib-back{display:none!important}
    html.embedded-library .lib-brand{pointer-events:none;cursor:default}
    html.embedded-library .library-loading{min-height:560px}
    html.embedded-library .lib-header{top:0}
    html.embedded-library .lib-main{padding-bottom:36px}
  </style>
</head>
<body>
  <div id="library-app"><div class="library-loading">Abriendo tu biblioteca…</div></div>
  <dialog id="library-modal"></dialog>
  <div id="library-toast" role="status" aria-live="polite"></div>
  <script type="module" src="/src/biblioteca-main.js"></script>
</body>
</html>
